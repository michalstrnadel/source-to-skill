name: Feature request
description: Suggest an improvement to extraction, generated skills, the CLI, or docs.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For a brand-new kind of source, use the **New source type** template instead.
        Open-ended ideas fit better in [Discussions](https://github.com/michalstrnadel/source-to-skill/discussions).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Include example commands or output if it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Extraction (extract.py / parsers)
        - Generated skill quality (SKILL.md templates)
        - CLI / install
        - Plugin / marketplace
        - Docs
        - Other
