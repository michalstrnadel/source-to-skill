<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="1200" height="356" role="img" aria-labelledby="t d">
  <title id="t">Supported sources</title>
  <desc id="d">Each source type and what your agent gets: YouTube videos become chapter segments with timestamp links, playlists and channels become course skills, podcasts and audio are transcribed locally with Whisper, papers keep methods, findings, limitations and citations, books keep chapters, articles become thesis and key claims, GitHub repos become library skills, and several sources combine into one topic skill.</desc>
  <!-- generated layout: 4x2 grid of source cards -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1430"/>
      <stop offset="1" stop-color="#130e1d"/>
    </linearGradient>
    <style>
      .k { font: 700 11px Helvetica, Arial, sans-serif; fill: #a78bfa; letter-spacing: 1.6px; }
      .h { font: 700 17px Helvetica, Arial, sans-serif; fill: #ffffff; }
      .s { font: 400 14px Helvetica, Arial, sans-serif; fill: #c9bcf2; }
      .card { fill: #ffffff; fill-opacity: 0.05; stroke: #a78bfa; stroke-opacity: 0.32; }
    </style>
  </defs>
  <rect width="1200" height="356" rx="24" fill="url(#panel)"/>
  <text class="k" x="40" y="36">SOURCE  →  WHAT YOUR AGENT GETS</text>
  <g transform="translate(40,58)">
    <rect class="card" width="270" height="124" rx="14"/>
    <g transform="translate(18,18)"><rect width="36" height="36" rx="9" fill="#7c3aed"/><path d="M14 10 L14 26 L27 18 Z" fill="#fff"/></g>
    <text class="h" x="66" y="42">YouTube video</text>
    <text class="s" x="18" y="84">segments/ per chapter</text>
    <text class="s" x="18" y="104">every answer links &amp;t= second</text>
  </g>
  <g transform="translate(330,58)">
    <rect class="card" width="270" height="124" rx="14"/>
    <g transform="translate(18,18)"><rect width="36" height="36" rx="9" fill="#7c3aed"/><rect x="8" y="9" width="14" height="3" rx="1.5" fill="#fff"/><rect x="8" y="16" width="14" height="3" rx="1.5" fill="#fff"/><rect x="8" y="23" width="9" height="3" rx="1.5" fill="#fff"/><path d="M22 19 L22 29 L30 24 Z" fill="#fff"/></g>
    <text class="h" x="66" y="42">Playlist / channel</text>
    <text class="s" x="18" y="84">course skill, lessons/</text>
    <text class="s" x="18" y="104">update adds new lessons</text>
  </g>
  <g transform="translate(620,58)">
    <rect class="card" width="270" height="124" rx="14"/>
    <g transform="translate(18,18)"><rect width="36" height="36" rx="9" fill="#7c3aed"/><rect x="14" y="7" width="8" height="15" rx="4" fill="#fff"/><path d="M10 18 a8 8 0 0 0 16 0" stroke="#fff" stroke-width="2.2" fill="none"/><rect x="17" y="26" width="2.2" height="4" fill="#fff"/></g>
    <text class="h" x="66" y="42">Podcast / audio</text>
    <text class="s" x="18" y="84">local Whisper transcript</text>
    <text class="s" x="18" y="104">timestamped segments</text>
  </g>
  <g transform="translate(910,58)">
    <rect class="card" width="270" height="124" rx="14"/>
    <g transform="translate(18,18)"><rect width="36" height="36" rx="9" fill="#7c3aed"/><path d="M11 7 L22 7 L27 12 L27 29 L11 29 Z" fill="#fff"/><path d="M22 7 L27 12 L22 12 Z" fill="#a78bfa"/></g>
    <text class="h" x="66" y="42">Paper (arXiv, PDF)</text>
    <text class="s" x="18" y="84">methods · findings</text>
    <text class="s" x="18" y="104">limitations · citations</text>
  </g>
  <g transform="translate(40,202)">
    <rect class="card" width="270" height="124" rx="14"/>
    <g transform="translate(18,18)"><rect width="36" height="36" rx="9" fill="#7c3aed"/><path d="M7 11 Q12.5 8 18 11 L18 28 Q12.5 25 7 28 Z M18 11 Q23.5 8 29 11 L29 28 Q23.5 25 18 28 Z" fill="#fff"/></g>
    <text class="h" x="66" y="42">Book (EPUB, PDF)</text>
    <text class="s" x="18" y="84">chapters/ on demand</text>
    <text class="s" x="18" y="104">glossary · cheatsheet</text>
  </g>
  <g transform="translate(330,202)">
    <rect class="card" width="270" height="124" rx="14"/>
    <g transform="translate(18,18)"><rect width="36" height="36" rx="9" fill="#7c3aed"/><rect x="9" y="8" width="18" height="21" rx="3" fill="#fff"/><rect x="12" y="12" width="12" height="2.6" rx="1.3" fill="#7c3aed"/><rect x="12" y="17" width="12" height="2.6" rx="1.3" fill="#7c3aed"/><rect x="12" y="22" width="8" height="2.6" rx="1.3" fill="#7c3aed"/></g>
    <text class="h" x="66" y="42">Web article</text>
    <text class="s" x="18" y="84">thesis · key claims</text>
    <text class="s" x="18" y="104">quotable highlights</text>
  </g>
  <g transform="translate(620,202)">
    <rect class="card" width="270" height="124" rx="14"/>
    <g transform="translate(18,18)"><rect width="36" height="36" rx="9" fill="#7c3aed"/><path d="M14 11 L8 18 L14 25" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 11 L28 18 L22 25" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="h" x="66" y="42">GitHub repo</text>
    <text class="s" x="18" y="84">library skill: install,</text>
    <text class="s" x="18" y="104">usage, per-area guides</text>
  </g>
  <g transform="translate(910,202)">
    <rect class="card" width="270" height="124" rx="14"/>
    <g transform="translate(18,18)"><rect width="36" height="36" rx="9" fill="#7c3aed"/><circle cx="12" cy="14" r="4.5" fill="#fff"/><circle cx="24" cy="14" r="4.5" fill="#fff"/><circle cx="18" cy="24" r="4.5" fill="#fff"/></g>
    <text class="h" x="66" y="42">Several sources</text>
    <text class="s" x="18" y="84">one topic skill</text>
    <text class="s" x="18" y="104">records disagreements</text>
  </g>
</svg>
