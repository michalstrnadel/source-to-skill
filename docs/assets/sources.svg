  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1430"/>
      <stop offset="1" stop-color="#130e1d"/>
    </linearGradient>
    <style>
      .k { font: 700 11px Helvetica, Arial, sans-serif; fill: #a78bfa; letter-spacing: 1.6px; }
      .h { font: 700 17px Helvetica, Arial, sans-serif; fill: #ffffff; }
      .s { font: 400 14px Helvetica, Arial, sans-serif; fill: #c9bcf2; }
      .card { fill: #ffffff; fill-opacity: 0.05; stroke: #a78bfa; stroke-opacity: 0.32; }
    </style>
  </defs>
  <rect width="1200" height="646" rx="24" fill="url(#panel)"/>
