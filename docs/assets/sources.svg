<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 646" width="1200" height="646" role="img" aria-labelledby="t d">
  <title id="t">Supported sources</title>
  <desc id="d">Each source type and what your agent gets: YouTube videos become chapter segments with timestamp links, playlists and channels become course skills, podcasts and audio are transcribed locally with Whisper, meeting transcripts keep decisions, action items and who said what, papers keep methods, findings, limitations and citations, books keep chapters, documentation sites with llms.txt become per-area guides, Word and PowerPoint files keep sections and speaker notes, articles become thesis and key claims, GitHub repos become library skills, Hacker News and Reddit threads keep consensus and dissent apart, notes folders such as Obsidian vaults become topics and decisions, and several sources combine into one topic skill.</desc>
