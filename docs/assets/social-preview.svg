    </g>
    <g transform="translate(864,410)">
      <rect width="112" height="36" rx="10" fill="#7c3aed" fill-opacity="0.35" stroke="#c4b5fd" stroke-opacity="0.7"/>
      <text x="56" y="24" text-anchor="middle" fill="#ffffff">Podcasts</text>
    </g>
    <g transform="translate(986,410)">
      <rect width="80" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="40" y="24" text-anchor="middle">arXiv</text>
    </g>
    <g transform="translate(540,456)">
      <rect width="172" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="86" y="24" text-anchor="middle">PDF &amp; EPUB books</text>
    </g>
    <g transform="translate(722,456)">
      <rect width="100" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="50" y="24" text-anchor="middle">Articles</text>
    </g>
    <g transform="translate(832,456)">
      <rect width="140" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="70" y="24" text-anchor="middle">GitHub repos</text>
    </g>
    <g transform="translate(982,456)">
      <rect width="114" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="57" y="24" text-anchor="middle">Audio files</text>
    </g>
  </g>

  <!-- footer -->
  <text x="540" y="572" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="18" fill="#8d7fb8">uvx source-to-skill install</text>
  <text x="540" y="600" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6f6193">Claude Code &#183; Copilot CLI &#183; Amp &#183; any Agent Skills host &#183; no API keys</text>
