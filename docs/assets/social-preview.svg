<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- source-to-skill GitHub social preview (1280x640), v0.5.0 -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1228"/>
      <stop offset="1" stop-color="#110c19"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#dots)"/>
  <circle cx="1220" cy="-40" r="300" fill="#7c3aed" fill-opacity="0.08"/>
  <circle cx="60" cy="680" r="260" fill="#7c3aed" fill-opacity="0.07"/>
  <circle cx="368" cy="320" r="230" fill="url(#glow)"/>

  <!-- logo motif, left -->
  <g transform="translate(80,132) scale(0.735)">
    <circle cx="392" cy="256" r="96" fill="#7c3aed" fill-opacity="0.2"/>
