    <path d="M148 238 L 356 249 L 356 263 L 148 274 Z" fill="#a78bfa" fill-opacity="0.85"/>
    <path d="M148 426 C 252 426 306 278 356 264 L 356 248 C 306 258 252 386 148 386 Z" fill="#a78bfa" fill-opacity="0.85"/>
    <rect x="48" y="56" width="96" height="96" rx="22" fill="#7c3aed"/>
    <rect x="48" y="208" width="96" height="96" rx="22" fill="#7c3aed"/>
    <rect x="48" y="360" width="96" height="96" rx="22" fill="#7c3aed"/>
    <path d="M82 80 L 82 128 L 124 104 Z" fill="#ffffff"/>
    <path d="M74 226 L 104 226 L 118 240 L 118 286 L 74 286 Z" fill="#ffffff"/>
    <path d="M104 226 L 118 240 L 104 240 Z" fill="#a78bfa"/>
    <rect x="72" y="380" width="48" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="392" width="32" height="7" rx="3.5" fill="#7c3aed"/>
    <rect x="80" y="405" width="32" height="7" rx="3.5" fill="#7c3aed"/>
    <rect x="80" y="418" width="22" height="7" rx="3.5" fill="#7c3aed"/>
    <path d="M392 168 C 400 226 422 238 480 256 C 422 274 400 286 392 344 C 384 286 362 274 304 256 C 362 238 384 226 392 168 Z" fill="#7c3aed"/>
    <path d="M452 168 C 455 187 463 192 482 198 C 463 204 455 209 452 228 C 449 209 441 204 422 198 C 441 192 449 187 452 168 Z" fill="#a78bfa"/>
  </g>

  <!-- version badge -->
  <rect x="540" y="168" width="88" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="584" y="190" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="16" font-weight="bold" fill="#c4b5fd">v0.5.0</text>

  <!-- wordmark and tagline -->
  <text x="536" y="282" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="bold" fill="#ffffff" letter-spacing="-1.5">source-to-skill</text>
  <text x="540" y="334" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#c9bcf2">Turn videos, podcasts, papers &amp; books</text>
  <text x="540" y="370" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#c9bcf2">into skills your coding agent loads on demand</text>

  <!-- source chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e9e3fb">
    <g transform="translate(540,410)">
      <rect width="108" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="54" y="24" text-anchor="middle">YouTube</text>
    </g>
    <g transform="translate(658,410)">
      <rect width="196" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35"/>
