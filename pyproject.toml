[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "source-to-skill"
version = "0.3.0"
description = "Turn YouTube videos, playlists, academic papers, books, web articles, and GitHub repos into agent skills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = [
    "agent-skills",
    "claude-code",
    "youtube",
    "playlist",
    "course",
    "arxiv",
    "pdf",
    "epub",
    "book",
    "article",
    "github",
    "skill",
    "llm",
    "yt-dlp",
    "pymupdf",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
youtube = ["yt-dlp"]
paper = ["PyMuPDF"]
dev = ["pytest", "yt-dlp", "PyMuPDF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
